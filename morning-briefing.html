<style>
/* VOICE everyday, playful: a comic-book mission briefing
   IDEA a frogman's waterproof mission card, drawn as a comic strip
   PICTURE the user's photo of a soldier, with a comic speech bubble; a live box-breathing square
   COLOUR white ground, thick black ink, gold for the five lines, red accent, frog green
   TYPE Bangers display + Nunito text
   LAYOUT title + frog, then breathe, Big Four, five golden lines, all one column on phones */
:root{color-scheme:light dark;--bg:light-dark(#fff,#15191d);--ink:light-dark(#111,#f2f2f2);--card:light-dark(#fff,#1f252b);--gold:light-dark(#ffcf33,#e8b820);--gold-ink:#111;--red:#e63946;--sea:light-dark(#dff4ff,#1b3140);--muted:light-dark(#555,#b5bcc4)}
:root[data-theme=light]{color-scheme:light}
:root[data-theme=dark]{color-scheme:dark}
*{box-sizing:border-box;min-width:0}
html,body{margin:0}
body{background:var(--bg);color:var(--ink);font:500 16px/1.55 Nunito,system-ui,sans-serif;overflow-x:clip}
.wrap{max-width:860px;margin:0 auto;padding:clamp(20px,4vw,48px) max(16px,4vw)}
h1,h2{font-family:Bangers,Impact,sans-serif;font-weight:400;letter-spacing:.02em;line-height:1.05;margin:0}
h1{font-size:clamp(44px,9vw,72px)}
h2{font-size:clamp(30px,5vw,40px);margin-bottom:14px}
p{margin:0}
.panel{background:var(--card);border:4px solid var(--ink);border-radius:18px;box-shadow:6px 6px 0 var(--ink);padding:20px;margin-top:28px}
.hero{display:grid;grid-template-columns:minmax(0,1.1fr) minmax(0,1fr);gap:16px;align-items:center;background:var(--sea)}
.hero p{font-size:18px;margin-top:10px;max-width:30em}
.frog{width:100%;height:auto;display:block}
.scene{width:100%;height:auto;display:block;border:4px solid var(--ink);border-radius:14px}
.shot{position:relative;margin:0}
.shot img{width:100%;height:auto;display:block;border:4px solid var(--ink);border-radius:14px}
.bubble{position:relative;margin:0 0 20px;background:#fff;color:#111;border:4px solid #111;border-radius:14px;padding:10px 14px;text-align:center;font-family:Bangers,Impact,sans-serif;font-size:clamp(22px,4vw,30px);line-height:1.1;letter-spacing:.02em;text-transform:uppercase;box-shadow:3px 3px 0 #111}
.bubble::after{content:"";position:absolute;left:calc(50% - 11px);bottom:-15px;width:22px;height:22px;background:#fff;border-right:4px solid #111;border-bottom:4px solid #111;transform:rotate(45deg)}
.breathe{display:grid;grid-template-columns:auto minmax(0,1fr);gap:24px;align-items:center}
.box{position:relative;width:170px;height:170px;border:5px solid var(--ink);border-radius:10px;background:var(--sea)}
.dot{position:absolute;width:26px;height:26px;border-radius:50%;background:var(--red);border:4px solid var(--ink);left:-15px;top:-15px}
.box.on .dot{animation:trace 16s linear infinite}
@keyframes trace{0%{left:-15px;top:150px}25%{left:-15px;top:-15px}50%{left:150px;top:-15px}75%{left:150px;top:150px}100%{left:-15px;top:150px}}
.cue{position:absolute;inset:0;display:grid;place-items:center;text-align:center;font-family:Bangers,Impact,sans-serif;font-size:30px;line-height:1}
.cue small{display:block;font-family:Nunito,sans-serif;font-size:14px;font-weight:800;margin-top:4px}
button{font:800 16px Nunito,sans-serif;min-height:44px;padding:8px 18px;border:3px solid var(--ink);border-radius:12px;background:var(--red);color:#fff;box-shadow:3px 3px 0 var(--ink);cursor:pointer}
button:active{transform:translate(3px,3px);box-shadow:none}
button:focus-visible,input:focus-visible{outline:3px solid var(--red);outline-offset:3px}
button.ghost{background:var(--card);color:var(--ink)}
.four{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:14px}
.step{border:3px solid var(--ink);border-radius:14px;padding:14px;background:var(--card)}
.step b{font-family:Bangers,Impact,sans-serif;font-weight:400;font-size:26px;display:flex;gap:10px;align-items:center}
.num{display:inline-grid;place-items:center;width:34px;height:34px;border-radius:50%;background:var(--ink);color:var(--bg);font-size:20px;flex:none}
.step p{margin-top:6px;color:var(--muted)}
.goals{grid-row:span 3}
.goal{width:100%;margin-top:10px}
.sr{position:absolute;width:1px;height:1px;overflow:hidden;clip:rect(0 0 0 0)}
.name{display:flex;flex-wrap:wrap;gap:10px;align-items:center;margin-bottom:16px}
.name label{font-weight:800}
input{font:600 16px Nunito,sans-serif;min-height:44px;padding:8px 12px;border:3px solid var(--ink);border-radius:12px;background:var(--card);color:var(--ink);width:12em}
.lines{list-style:none;margin:0;padding:0;display:grid;gap:14px}
.line{display:grid;grid-template-columns:minmax(0,1fr) auto;gap:12px;align-items:center;background:var(--gold);color:var(--gold-ink);border:4px solid #111;border-radius:16px;box-shadow:5px 5px 0 #111;padding:14px 16px;cursor:pointer;user-select:none}
.line q{font-family:Bangers,Impact,sans-serif;font-size:clamp(24px,4.4vw,32px);line-height:1.1;quotes:none}
.ticks{display:flex;gap:6px}
.ticks i{width:18px;height:18px;border-radius:50%;border:3px solid #111;background:#fff}
.ticks i.on{background:var(--red)}
.done .line{opacity:.95}
.how{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:12px;margin-top:16px}
.how div{border:3px dashed var(--ink);border-radius:12px;padding:10px 12px}
.how b{display:block;font-family:Bangers,Impact,sans-serif;font-weight:400;font-size:22px}
.row{display:flex;flex-wrap:wrap;gap:10px;align-items:center;margin-top:16px}
.note{font-size:13px;color:var(--muted);margin-top:22px}
@media(max-width:600px){.hero,.breathe{grid-template-columns:minmax(0,1fr)}.box{margin:0 auto}.four,.how{grid-template-columns:minmax(0,1fr)}.frog{max-width:300px;margin:0 auto}}
@media(prefers-reduced-motion:reduce){.box.on .dot{animation:none;left:67px;top:67px}}
</style>
</head>
<body>
<div class="wrap">

<section class="panel hero">
  <div>
    <h1>Morning Briefing</h1>
    <p>Life is War, and that's why I thrive. I love pain, I love suffering. It gives me clarity and purpose.</p>
  </div>
  <figure class="shot">
    <p class="bubble">Hell week. I wish it was harder.</p>
    <img src="assets/seal.jpg" width="900" height="1080" alt="Muscular blonde soldier in a tactical vest at sunset, a helicopter behind him">
  </figure>
</section>

<section class="panel">
  <h2>Box breathe</h2>
  <div class="breathe">
    <div class="box" id="box"><span class="dot"></span><div class="cue" id="cue">Ready?<small>tap start</small></div></div>
    <div>
      <div class="row"><button id="go">Start breathing</button></div>
    </div>
  </div>
</section>

<section class="panel">
  <h2>The Big Four · your morning route</h2>
  <div class="four">
    <div class="step goals"><b><span class="num">1</span>Goal</b>
      <label class="sr" for="g0">Goal 1</label><input id="g0" class="goal" placeholder="Goal 1">
      <label class="sr" for="g1">Goal 2</label><input id="g1" class="goal" placeholder="Goal 2">
      <label class="sr" for="g2">Goal 3</label><input id="g2" class="goal" placeholder="Goal 3">
    </div>
    <div class="step"><b><span class="num">2</span>See it</b></div>
    <div class="step"><b><span class="num">3</span>Say it</b></div>
    <div class="step"><b><span class="num">4</span>Control</b></div>
  </div>
</section>

<section class="panel">
  <h2>The seven golden lines</h2>
  <div class="name"><label for="nm">Your name:</label><input id="nm" placeholder="Type it here" autocomplete="given-name"></div>
  <ol class="lines" id="lines"></ol>
  <div class="row"><button class="ghost" id="reset">Reset ticks</button><span id="tally" aria-live="polite"></span></div>
</section>

<section class="panel reward">
  <h2>The reward</h2>
  <img class="scene" src="assets/car.jpg" width="1400" height="788" alt="Young blonde man driving an orange convertible along a beach road at sunset">
</section>

</div>

<script>
{
const lines=[
  ["I am a winner. God is on my side.","{N}, you are a winner. God is on your side."],
  ["The more I suffer, the less my family suffers. I am the workhorse.","{N}, the more you suffer, the less your family suffers. You are the workhorse."],
  ["I don't need to feel ready. I just need to move.","{N}, you don't need to feel ready. You just need to move."],
  ["Pain is information, not orders. I feel it and keep going.","{N}, pain is information, not orders. Feel it and keep going."],
  ["When I want to quit, I do one more. One rep. One minute. One step.","{N}, when you want to quit, do one more. One rep. One minute. One step."],
  ["My word is iron willed. I will complete my checklist today.","{N}, your word is iron willed. You will complete your checklist today."],
  ["I will be a millionaire by the end of 2026.","{N}, you will be a millionaire by the end of 2026."]
];
const store={get(k){try{return localStorage.getItem(k)}catch(e){return null}},set(k,v){try{localStorage.setItem(k,v)}catch(e){}}};
const nm=document.getElementById('nm');
const list=document.getElementById('lines');
const tally=document.getElementById('tally');
let counts=lines.map(()=>0);
try{const c=JSON.parse(store.get('mb-counts')||'null');if(Array.isArray(c)&&c.length===lines.length)counts=c.map(n=>Math.min(3,Number(n)||0))}catch(e){}
nm.value=store.get('mb-name')||'';
const esc=s=>s.replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
function render(){
  const n=nm.value.trim();
  list.innerHTML=lines.map((l,i)=>{
    const t=counts[i]===1&&n?l[1].replace('{N}',esc(n)):l[0];
    return `<li class="line" data-i="${i}" tabindex="0" role="button" aria-label="Said ${counts[i]} of 3 times"><q>${t}</q><span class="ticks">${[0,1,2].map(k=>`<i class="${k<counts[i]?'on':''}"></i>`).join('')}</span></li>`;
  }).join('');
  const total=counts.reduce((a,b)=>a+b,0);
  tally.textContent=total===lines.length*3?`All ${total} reps done. Go win the day.`:`${total} of ${lines.length*3} reps`;
}
function hit(el){const i=Number(el.dataset.i);counts[i]=counts[i]>=3?0:counts[i]+1;store.set('mb-counts',JSON.stringify(counts));render()}
list.addEventListener('click',e=>{const el=e.target.closest('.line');if(el)hit(el)});
list.addEventListener('keydown',e=>{const el=e.target.closest('.line');if(el&&(e.key==='Enter'||e.key===' ')){e.preventDefault();hit(el);list.querySelector(`[data-i="${el.dataset.i}"]`).focus()}});
nm.addEventListener('input',()=>{store.set('mb-name',nm.value);render()});
document.getElementById('reset').addEventListener('click',()=>{counts=lines.map(()=>0);store.set('mb-counts',JSON.stringify(counts));render()});
render();

const today=new Date().toDateString();
let goals=['','',''];
try{const g=JSON.parse(store.get('mb-goals')||'null');if(g&&g.day===today&&Array.isArray(g.list))goals=g.list.slice(0,3).map(String)}catch(e){}
[0,1,2].forEach(i=>{const el=document.getElementById('g'+i);el.value=goals[i]||'';el.addEventListener('input',()=>{goals[i]=el.value;store.set('mb-goals',JSON.stringify({day:today,list:goals}))})});

const box=document.getElementById('box');
const cue=document.getElementById('cue');
const go=document.getElementById('go');
const phases=['Breathe in','Hold','Breathe out','Hold'];
let timer=null;
function stop(){clearInterval(timer);timer=null;box.classList.remove('on');cue.innerHTML='Nice.<small>tap start again</small>';go.textContent='Start breathing'}
go.addEventListener('click',()=>{
  if(timer){stop();return}
  let sec=0;
  box.classList.remove('on');void box.offsetWidth;box.classList.add('on');
  go.textContent='Stop';
  const tick=()=>{
    if(sec>=64){stop();cue.innerHTML='Done.<small>4 rounds</small>';return}
    const p=Math.floor(sec/4)%4,left=4-sec%4,round=Math.floor(sec/16)+1;
    cue.innerHTML=`${phases[p]}<small>${left} · round ${round} of 4</small>`;
    sec++;
  };
  tick();timer=setInterval(tick,1000);
});
}
</script>
</body>
</html>
